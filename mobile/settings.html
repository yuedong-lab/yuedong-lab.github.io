<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="悦动工作室官方网站 - 一群满怀激情的编程爱好者组成的软件开发团队，专注于软件创新与开发。">
    <meta name="keywords" content="悦动工作室,悦动,编程,软件开发,工作室">
    <meta name="author" content="悦动工作室">
    <link rel="icon" href="../Picture/icon.webp" type="image/webp">
    <title>悦动工作室官方网站</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        #backButton {
            color: white;
            text-decoration: none;
            text-align:center;
            font-size: 15px;
            padding: 6px 10px;
            border-radius: 8px;
            height:35px;
            transition: background-color 0.3s;
        }

        #backButton:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #settings {
            display: block;
            margin-left: 100px;
            margin-right: 100px;
            margin-top:100px;
            height: 100%;
            width:auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 2px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        #settings h1 {
            font-weight: 250;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        #operation {
            margin-left: 100px;
            margin-right: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 50px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 2px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .operation-btn {
            display: flex;
            padding: 14px 36px;
            background: linear-gradient(135deg, #1385ff, #49a1ff);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .operation-btn:hover {
            opacity: 0.85;
        }

        #settings label {
            font-size: 18px;
            margin-right: 10px;
        }

        #maxParticles {
            width: 60px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav id="topNav">
        <div class="nav-header">
            <span class="nav-title" onclick="location.href='./index.html'" style="cursor:pointer;">悦动工作室</span>
            <div class="nav-actions">
                <button id="themeToggle" aria-label="切换主题">
                    <svg class="theme-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path class="sun-icon" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.95 16.95l1.42 1.42M5.64 18.36l1.42-1.42M16.95 7.05l1.42-1.42M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z" style="display:none"></path>
                        <path class="moon-icon" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path>
                    </svg>
                </button>
                <a href="./index.html" id="backButton">&#8592; 返回</a>
            </div>
        </div>
    </nav>

    <div id="mainContent">
        <canvas id="fireworksCanvas"
            style="position:fixed;background-color:transparent;top:0;left:0;z-index:-1;"></canvas>
            
        <div id="settings">
            <h1>烟花设置</h1>
            <label for="maxParticles">最大烟花数量:</label>
            <input type="number" id="maxParticles" min="1" max="10" value="3" class="input">
        </div>
        <div id="operation">
            <button class="operation-btn" onclick="exit(false);">保存更改并退出</button>
            <br>
            <button class="operation-btn" onclick="exit(true,false);">放弃更改</button>
            <br>
            <button class="operation-btn" onclick="exit(true, true);">放弃更改并退出</button>
        </div>
    </div>
    <div id="versionInfo"></div>
    <script src="../shared/devMode.js"></script>
    <script src="../shared/fetchTime.js"></script>
    <script src="../version.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
        var changed = false;
        function initialize() {
            changed = false;
            var maxParticles = localStorage.getItem('maxParticles');
            if (maxParticles) {
                $("#maxParticles").prop("value", maxParticles);
            } else {
                $("#maxParticles").prop("value", 3);
            }
        }

        initialize();

        syncTimeBase();
        timeCheck(getDate());
        setInterval(timeCheck, 10000, getDate());
        $("#versionInfo").text(currentVersion);
        $("body").css("display", "block");

        async function exit(discardChanges, exit = false) {
            if (discardChanges) {
                if (exit) {
                    if (!changed) {
                        window.location.href = "./index.html";
                        return;
                    }
                    var result = await showConfirmModal("确认要放弃所有更改并退出吗？");
                    if (result) {
                        //恢复所有设置至初始状态
                        initialize();
                        window.location.href = "./index.html";
                    }
                } else {
                    if (!changed) {
                        await showConfirmModal("你还没有任何更改！", false);
                        return;
                    }
                    var result = await showConfirmModal("确认要放弃所有更改吗？");
                    if (result) {
                        //恢复所有设置至初始状态
                        initialize();
                    }
                }

            } else {
                if (!changed) {
                    window.location.href = "./index.html";
                    return;
                }
                var result = await showConfirmModal("确认要保存所有更改并退出吗？");
                if (result) {
                    //保存设置
                    var maxParticles = $("#maxParticles").prop("value");
                    localStorage.setItem('maxParticles', maxParticles);

                    window.location.href = "./index.html";
                }
            }
        }
        document.getElementById('maxParticles').addEventListener('input', () => { changed = true });
    </script>
</body>

</html>
