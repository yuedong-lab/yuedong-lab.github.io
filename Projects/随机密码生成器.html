<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background-color: rgb(0, 0, 0);
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        #box {
            background-color: rgb(255, 255, 255);
            width: 100%;
            max-width: 1450px;
            min-height: 100vh;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        #ztl {
            background-color: #0033FF;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 20px;
        }

        #langBtn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            padding: 5px 15px;
            font-size: 16px;
            cursor: pointer;
            width: auto;
            height: auto;
            margin: 0;
            transition: background-color 0.3s;
        }

        #langBtn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        #ztl-title {
            font-size: 20px;
            color: rgb(255, 255, 255);
            text-align: center;
            display: block;
        }

        #menu {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .text {
            font-size: 17px;
            display: block;
            text-align: center;
            margin: 10px 0 0 0;
        }

        .input {
            width: 100%;
            max-width: 400px;
            height: 40px;
            margin: 10px auto;
            padding-left: 10px;
            border: 1px solid #0033FF;
            border-radius: 10px;
            font-size: 20px;
            display: block;
        }

        .input:focus {
            outline: none;
            border-color: #0033FF;
            box-shadow: 0 0 5px rgba(0, 51, 255, 0.3);
        }

        .input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        #menu button {
            width: 100%;
            max-width: 400px;
            height: 45px;
            margin: 10px auto;
            border: 1px solid #0033FF;
            border-radius: 10px;
            background-color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            display: block;
        }

        #menu button:hover {
            background-color: #0033FF;
            color: white;
        }

        #makeButton {
            margin-top: 10px;
        }

        #copy {
            width: 100%;
            max-width: 400px;
            margin: 10px 0;
            display: block;
        }

        #resultRow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        #resultRow label {
            margin: 0;
        }

        #resultRow button {
            width: auto;
            max-width: none;
            padding: 0 30px;
            margin: 0;
            height: 40px;
        }

        #passwordsOutput {
            width: 100%;
            max-width: 400px;
            height: 130px;
            margin: 10px auto;
            padding-left: 10px;
            border: 1px solid #0033FF;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            display: block;
        }

        #passwordsOutput:focus {
            outline: none;
        }

        @media (max-width: 600px) {
            #ztl {
                height: 70px;
                padding: 0 10px;
            }

            #ztl-title {
                font-size: 16px;
            }

            #langBtn {
                right: 10px;
                padding: 4px 10px;
                font-size: 14px;
            }

            #menu {
                padding: 10px;
            }

            .text {
                font-size: 15px;
            }

            .input {
                font-size: 16px;
                height: 36px;
            }

            #menu button {
                height: 40px;
                font-size: 14px;
            }
        }
    </style>
    <title data-lang="title">密码生成器</title>
</head>

<body>
    <div id="box">
        <div id="ztl">
            <span id="ztl-title" data-lang="header">随机密码生成器</span>
            <button id="langBtn">EN</button>
        </div>
        <div id="menu">

            <label for="length" id="len" class="text" data-lang="lengthLabel">请输入密码的长度</label>
            <input class="input" id="length" type="number" min="1" max="100" required />
            <label id="num" class="text" for="numPasswords" data-lang="numLabel">请输入生成的密码数量</label>
            <input class="input" type="number" id="numPasswords" required />
            <label class="text" id="symbol" for="symbolSwitch">
                <input type="checkbox" id="symbolSwitch" name="symbol">
                启用特殊符号（可能导致网站崩溃）
            </label>
            <button id="makeButton" data-lang="generateBtn">开始生成</button>
            <div id="resultRow">
                <label id="make" class="text" style="margin:0;" onclick="make()" data-lang="resultLabel">生成结果</label>
                <button id="copy" onclick="copy()" data-lang="copyBtn">复制</button>
            </div>
            <textarea id="passwordsOutput" readonly></textarea>

        </div>
    </div>

    <script>
        var characters;
        const checkbox = document.querySelector("input[name='symbol']")
        const translations = {
            'zh': {
                'title': '密码生成器',
                'header': '随机密码生成器',
                'lengthLabel': '请输入密码的长度',
                'numLabel': '请输入生成的密码数量',
                'generateBtn': '开始生成',
                'resultLabel': '生成结果',
                'copyBtn': '复制',
                'langBtn': 'EN',
                'errEmpty': '密码长度或密码数量不能为空',
                'errNumMin': '密码数量不能小于1',
                'errLenMin': '密码长度不能小于1',
                'errLenMax': '密码长度不能大于100',
                'errNumMax': '密码数量不能大于100',
                'pwPrefix': '密码'
            },
            'en': {
                'title': 'Password Generator',
                'header': 'Random Password Generator',
                'lengthLabel': 'Enter password length',
                'numLabel': 'Enter number of passwords',
                'generateBtn': 'Generate',
                'resultLabel': 'Results',
                'copyBtn': 'Copy',
                'langBtn': '中',
                'errEmpty': 'Password length or number cannot be empty',
                'errNumMin': 'Number of passwords cannot be less than 1',
                'errLenMin': 'Password length cannot be less than 1',
                'errLenMax': 'Password length cannot be greater than 100',
                'errNumMax': 'Number of passwords cannot be greater than 100',
                'pwPrefix': 'Password'
            }
        };

        let currentLang = 'zh';

        function switchLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const langData = translations[currentLang];

            // Update all elements with data-lang attribute
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (langData[key]) {
                    el.innerHTML = langData[key];
                }
            });

            // Update title
            document.title = langData.title;

            // Update language button
            document.getElementById('langBtn').textContent = langData.langBtn;

            // Store current language
            localStorage.setItem('preferredLang', currentLang);
        }

        function getText(key) {
            return translations[currentLang][key] || translations['zh'][key];
        }

        function getErrorText(key) {
            return translations[currentLang][key] || translations['zh'][key];
        }

        const generatePassword = (length) => {
            characters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789`!@#$%^&*()_+-=[]\\{}|:";\',./<>?';
            let password = '';
            if(!checkbox.checked){
                characters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789`!@#$%^&*()_+-=[]{}|:";\',<>?'
            }
            for (let i = 0; i < length; i++) {
                password += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return password;
        };

        const generatePasswords = (numPasswords, length) => {
            const passwords = [];
            for (let i = 0; i < numPasswords; i++) {
                passwords.push(generatePassword(length));
            }
            return passwords;
        };

        document.getElementById('makeButton').addEventListener('click', () => {
            const length = document.getElementById('length').value;
            const numPasswords = document.getElementById('numPasswords').value;

            if (numPasswords == "" || length == "") {
                document.getElementById("passwordsOutput").value = getErrorText('errEmpty');
                return;
            }
            if (numPasswords < 1) {
                document.getElementById("passwordsOutput").value = getErrorText('errNumMin');
                return;
            }

            if (length < 1) {
                document.getElementById("passwordsOutput").value = getErrorText('errLenMin');
                return;
            }

            if (length > 100) {
                document.getElementById("passwordsOutput").value = getErrorText('errLenMax');
                return;
            }

            if (numPasswords > 100) {
                document.getElementById("passwordsOutput").value = getErrorText('errNumMax');
                return;
            }

            const passwords = generatePasswords(numPasswords, length);
            const pwPrefix = getText('pwPrefix');
            const output = passwords.map((password, index) => `${pwPrefix} ${index + 1}: ${password}`).join('\n');
            document.getElementById('passwordsOutput').value = output;
        });

        // Language button click handler
        document.getElementById('langBtn').addEventListener('click', switchLanguage);

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                var textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                var result = document.execCommand('copy');
                document.body.removeChild(textArea);
                return result;
            }
        }

        function copy() {
            copyTextToClipboard(document.getElementById("passwordsOutput").value);
        }

        // Restore saved language preference on load
        (function initLanguage() {
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                const langData = translations[currentLang];
                document.querySelectorAll('[data-lang]').forEach(el => {
                    const key = el.getAttribute('data-lang');
                    if (langData[key]) {
                        el.innerHTML = langData[key];
                    }
                });
                document.title = langData.title;
                document.getElementById('langBtn').textContent = langData.langBtn;
            }
        })();
    </script>
</body>

</html>
