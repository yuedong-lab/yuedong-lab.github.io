<!DOCTYPE html>
<html lang="zh-cn">
<head>

    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            display: block !important;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 300ms ease, color 300ms ease;
        }

        #mainNav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #navTitle {
            color: rgb(252, 203, 68);
            font-size: 20px;
            font-weight: bold;
            min-width: 120px;
            margin-left: 10px;
            margin-right:10px;
            cursor: pointer;
            user-select: none;
            line-height: 50px;
        }

        #navTitle:hover {
            color: rgb(255, 215, 80);
        }

        #navLockToggle {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.3s;
            margin-right:10px;
        }

        #navLockToggle:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #navLockToggle .lock-icon { display: none; }
        #navLockToggle .unlock-icon { display: block; }
        #navLockToggle.locked .lock-icon { display: block; }
        #navLockToggle.locked .unlock-icon { display: none; }

        #themeToggle {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            margin-left: 5px;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        #themeToggle:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .theme-icon { transition: transform 0.3s ease; }
        .sun-icon { display: none; }
        .moon-icon { display: block; }
        body.dark-mode .sun-icon { display: block !important; }
        body.dark-mode .moon-icon { display: none !important; }

        #backButton {
            color: white;
            text-decoration: none;
            font-size: 15px;
            padding: 6px 10px;
            border-radius: 8px;
            height:25px;
            transition: background-color 0.3s;
            margin-left:auto;
            margin-right:20px;
        }

        #backButton:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #versionInfo {
            position: fixed;
            left: 10px;
            bottom: 10px;
            color: rgba(0, 0, 0, 0.65);
            font-size: 12px;
            z-index: 998;
        }

        body.dark-mode #versionInfo {
            color: rgba(255, 255, 255, 0.65);
        }

        .content {
            margin-top: 100px;
            padding: 20px;
        }

        h1, p { cursor: default; }

        .header {
            text-align: center;
            margin-top: 40px;
        }

        .header #name {
            text-shadow: 2px 2px 6px rgba(0, 0, 70, 0.5), 4px 4px 12px rgba(0, 0, 70, 0.25);
            font-size: 40px;
            font-weight: 300;
            color: var(--text-color);
            margin-top: 10px;
        }

        body.dark-mode .header #name {
            text-shadow: 2px 2px 6px rgba(100, 100, 200, 0.5), 4px 4px 12px rgba(100, 100, 200, 0.25);
        }

        .header #introduce {
            text-align: left;
            margin-left: 75px;
            padding-left: 75px;
            font-size: 25px;
            font-weight: 350;
            margin-top: 0px;
        }

        .header #sign {
            text-align: left;
            margin-left: 75px;
            padding-left: 75px;
            font-size: 25px;
            font-weight: 350;
            margin-top: -25px;
        }

        a {
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
        }

        #contact {
            margin-left: 150px;
            margin-top: 30px;
            font-size: 25px;
            font-weight: 350;
        }

        #contact-way2 { margin-top: -30px; }

        #job_program {
            font-size: 15px;
            font-weight: 500;
            background-color: #006eff55;
            color: #006eff;
            border-radius: 10px;
            width: 80px;
            margin-left: 47%;
            margin-top: -30px;
            text-align: center;
        }

        .header #image_program {
            width: 180px;
            height: 180px;
            border-radius: 200px;
            border: 5px solid #006eff;
        }

        #job_program_master {
            font-size: 15px;
            font-weight: 500;
            background-color: #00aaa255;
            color: #00aaa2;
            border-radius: 10px;
            width: 100px;
            margin-left: 47.5%;
            margin-top: -30px;
            text-align: center;
        }

        .header #image_program_master {
            width: 180px;
            height: 180px;
            border-radius: 200px;
            border: 5px solid #00aaa2;
        }

        #job_master {
            font-size: 15px;
            font-weight: 550;
            background-color: #ffa60055;
            color: #cf8700;
            border-radius: 10px;
            width: 80px;
            margin-left: 47.5%;
            margin-top: -30px;
            text-align: center;
        }

        .header #image_master {
            width: 180px;
            height: 180px;
            border-radius: 200px;
            border: 5px solid #e99f00;
        }

        @media (max-width: 768px) {
            #mainNav::before { font-size: 16px; min-width: 80px; }
            #backButton { font-size: 14px; padding: 6px 15px; }
            #themeToggle { margin-right: 10px; }
            .header #introduce,
            .header #sign { margin-left: 20px; padding-left: 20px; font-size: 18px; }
            #contact { margin-left: 40px; font-size: 18px; }
            #contact-way2 { margin-top: -20px; }
            #job_program, #job_master { margin-left: 44%; }
            #job_program_master { margin-left: 44%; }
            .header #name { font-size: 30px; }
        }

        @media (max-width: 400px) {
            .header #introduce,
            .header #sign { font-size: 15px; }
            #contact { font-size: 15px; margin-left: 20px; }
        }

        img {
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
        }

    </style>
</head>
<body>
    <nav id="mainNav">
        <a id="navTitle" href="./index.html" style="cursor:pointer;user-select:none;">悦动工作室</a>
        <button id="navLockToggle" aria-label="锁定导航栏">
            <svg class="lock-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <svg class="unlock-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
            </svg>
        </button>
        <button id="themeToggle" aria-label="切换主题">
            <svg class="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path class="sun-icon" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.95 16.95l1.42 1.42M5.64 18.36l1.42-1.42M16.95 7.05l1.42-1.42M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z" style="display:none"></path>
                <path class="moon-icon" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path>
            </svg>
        </button>
        <a href="./index.html" id="backButton">&#8592; 返回主页</a>
    </nav>
    <div class="content">
        <div class="header" id="memberHeader">
            <img src="" id="memberImage" draggable="false">
            <h1 id="name"></h1>
            <p id="memberJob"></p>
            <p id="introduce"></p>
            <p id="sign" style="display:none;"></p>
        </div>
        <div id="contact">
            <div id="contactContent"></div>
        </div>
    </div>
        <div id="versionInfo">Pre_7.29.4</div>

    <script src="../shared/devMode.js"></script>
    <script>
        // 版本: Pre_7.29.4 - 成员页面脚本（PC端）

        var members = {
            1: {
                name: '小郑',
                title: '室长',
                role: 'master',
                avatar: '../Picture/member_1.webp',
                intro: '介绍：悦动工作室室长',
                sign: '',
                contact: [
                    'QQ号：2236933051',
                    '邮箱：2236933051@qq.com'
                ]
            },
            2: {
                name: '反性能老魔',
                title: '副室长',
                role: 'master',
                avatar: '../Picture/member_5.webp',
                intro: '介绍：会Python，javascript和一点点css。据说他的电脑用的是3代i5……',
                sign: '键盘总得敲到废，代码写到人疲累',
                contact: [
                    'QQ号：3171244185',
                    '邮箱：3171244185@qq.com'
                ]
            },
            3: {
                name: '超级苦力怕1324',
                title: '程序组长',
                role: 'program_master',
                avatar: '../Picture/member_2.webp',
                intro: '介绍：会python和html,css,JavaScript，懂得安卓，windows软件和网站开发',
                sign: '',
                contact: [
                    'QQ号：2672066839',
                    '邮箱：2672066839@qq.com'
                ]
            },
            4: {
                name: '普通的编程萌新',
                title: '程序组',
                role: 'program',
                avatar: '../Picture/member_4.webp',
                intro: '介绍：一个普通到不能再普通的编程萌新会Python，还会一点JavaScript、和C语言',
                sign: '',
                contact: [
                    'QQ号：2100400850',
                    '邮箱：2100400850@qq.com'
                ]
            }
        };

        function getUrlParam(name) {
            var match = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        function renderMember(id) {
            var data = members[id];
            if (!data) {
                window.location.href = '../404.html';
                return;
            }
            document.title = data.name + ' - 个人主页';

            var img = document.getElementById('memberImage');
            img.src = data.avatar;
            img.alt = data.name;
            img.id = 'image_' + data.role;

            document.getElementById('name').textContent = data.name;

            var job = document.getElementById('memberJob');
            job.textContent = data.title;
            job.id = 'job_' + data.role;
            job.style.display = 'block';

            document.getElementById('introduce').textContent = data.intro;

            var sign = document.getElementById('sign');
            if (data.sign) {
                sign.textContent = data.sign;
                sign.style.display = 'block';
            } else {
                sign.style.display = 'none';
            }

            var contactContent = document.getElementById('contactContent');
            contactContent.innerHTML = '';
            if (data.contact && data.contact.length > 0) {
                data.contact.forEach(function(item) {
                    var p = document.createElement('p');
                    if (contactContent.children.length === 0) {
                        p.id = 'contact-way1';
                    } else {
                        p.id = 'contact-way2';
                    }
                    p.textContent = item;
                    contactContent.appendChild(p);
                });
            } else {
                var p = document.createElement('p');
                p.style.cssText = 'font-size:18px;opacity:0.5;margin-top:10px;';
                p.textContent = '暂无联系方式';
                contactContent.appendChild(p);
            }
        }

        // 导航栏逻辑
        var nav = document.getElementById('mainNav');
        var timer;
        var navLocked = localStorage.getItem('navLocked') === 'true';

        function updateLockButton() {
            var lockBtn = document.getElementById('navLockToggle');
            if (lockBtn) {
                if (navLocked) {
                    lockBtn.classList.add('locked');
                    lockBtn.title = '解锁导航栏';
                } else {
                    lockBtn.classList.remove('locked');
                    lockBtn.title = '锁定导航栏';
                }
            }
        }

        function applyNavLock() {
            if (navLocked) {
                nav.style.transform = 'translateY(0)';
                nav.style.opacity = '1';
                nav.style.visibility = 'visible';
                clearTimeout(timer);
            }
        }

        function toggleNavLock() {
            navLocked = !navLocked;
            localStorage.setItem('navLocked', navLocked);
            updateLockButton();
            applyNavLock();
        }

        nav.addEventListener('mouseenter', function() {
            if (navLocked) return;
            clearTimeout(timer);
            nav.style.transform = 'translateY(0)';
            nav.style.opacity = '1';
            nav.style.visibility = 'visible';
        });

        nav.addEventListener('mouseleave', function() {
            if (navLocked) return;
            timer = setTimeout(function() {
                nav.style.transform = 'translateY(-50px)';
                nav.style.opacity = '0';
            }, 1000);
        });

        window.addEventListener('DOMContentLoaded', function() {
            updateLockButton();
            var lockBtn = document.getElementById('navLockToggle');
            if (lockBtn) {
                lockBtn.addEventListener('click', toggleNavLock);
            }

            if (navLocked) {
                nav.style.transform = 'translateY(0)';
                nav.style.opacity = '1';
                nav.style.visibility = 'visible';
            } else {
                nav.style.transform = 'translateY(0)';
                nav.style.opacity = '1';
                nav.style.visibility = 'visible';
                setTimeout(function() {
                    nav.style.transform = 'translateY(-50px)';
                    nav.style.opacity = '0';
                }, 5000);
            }

            var memberId = getUrlParam('id');
            if (!memberId) {
                window.location.href = '../404.html';
                return;
            }
            renderMember(memberId);
        });
    </script>
</body>
</html>
