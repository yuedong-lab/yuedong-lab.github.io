<!--版本: beta_8.5.1 (UA检测入口)-->
<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悦动工作室官方网站</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .loading-container {
        text-align: center;
        padding: 40px;
      }

      .loading-icon {
        width: 255px;
        height: 240px;
        border-radius: 0px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loading-text {
        font-size: 22px;
        opacity: 0.8;
        animation: fadeInOut 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }

        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.5;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="loading-container">
      <img src="./Picture/icon.webp" alt="悦动工作室" class="loading-icon" />
      <p class="loading-text">正在加载中，请稍候</p>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
      function classifyDevice() {
        const ua = navigator.userAgent;
        const w = screen.width;
        const h = screen.height;
        const maxTouch = navigator.maxTouchPoints || 0;

        // ----- 1. UA 明确是手机（排除平板关键字）-----
        if (
          /iPhone|iPod|Android(?!.*Tablet)|Windows Phone|BlackBerry|webOS|Opera Mini/i.test(
            ua,
          )
        ) {
          return 1;
        }

        // ----- 2. UA 明确是平板 -----
        if (
          /iPad|Tablet|Kindle|Silk|PlayBook|Nexus 7|Nexus 9|SM-T|KFAPWI/i.test(
            ua,
          )
        ) {
          return 1;
        }

        // ----- 3. Windows / Chrome OS / Linux 一律视为电脑（含触摸屏）-----
        if (/Windows NT|CrOS|Linux/i.test(ua)) {
          // 仅对 Linux 极小型嵌入式设备（如路由器、手表）做极窄屏兜底，避免误判
          if (/Linux/i.test(ua) && (w < 600 || h < 600) && maxTouch > 0) {
            return 1;
          }
          return 2; // Surface、触摸屏笔记本、Chromebook 统统输出 2
        }

        // ----- 4. Macintosh 特殊处理（精准识别 iPad 伪装）-----
        if (/Macintosh/.test(ua)) {
          // iPad 伪装的特征：
          // 1) 多指触控点数 >= 5（真实 Mac 触摸板只报告 0 或 1，外接触摸屏也极少超过 1）
          // 2) 物理分辨率在平板常见范围（宽度 < 1366 且 高度 < 1366）
          // 3) 支持 ontouchstart（综合判断）
          const isIpad =
            maxTouch >= 5 && w < 1366 && h < 1366 && "ontouchstart" in window;
          if (isIpad) {
            return 1;
          }
          // 其他所有 Mac（含带触摸板的 MacBook、外接触摸屏的 Mac）均视为电脑
          return 2;
        }

        // ----- 5. 兜底（针对 UA 极罕见的未知设备）-----
        const hasTouch =
          maxTouch > 0 ||
          "ontouchstart" in window ||
          (window.matchMedia &&
            window.matchMedia("(any-pointer: coarse)").matches);

        if (hasTouch) {
          // 有触摸且物理尺寸明显偏小（< 1024px）→ 移动设备；否则视为触摸电脑
          return w < 1024 && h < 1024 ? 1 : 2;
        } else {
          // 无触摸，极窄屏（<600px）→ 手机；其余 → 电脑
          return w < 600 || h < 600 ? 1 : 2;
        }
      }

      // 测试
      console.log(classifyDevice()); // 现在你的电脑应该稳定输出 2 了
    </script>
  </body>
</html>
