<!--版本: beta_8.5.1 (UA检测入口)-->
<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悦动工作室官方网站</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .loading-container {
        text-align: center;
        padding: 40px;
      }

      .loading-icon {
        width: 255px;
        height: 240px;
        border-radius: 0px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loading-text {
        font-size: 22px;
        opacity: 0.8;
        animation: fadeInOut 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }

        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.5;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="loading-container">
      <img src="./Picture/icon.webp" alt="悦动工作室" class="loading-icon" />
      <p class="loading-text">正在加载中，请稍候</p>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>/**
       * 判断设备类别：手机/平板 或 电脑（含触摸屏）
       * 结合 UA、分辨率、触摸屏三重判断
       * @returns {1 | 2} 1=手机/平板，2=电脑（含触摸屏）
       */
      function classifyDevice() {
        const ua = navigator.userAgent;
        const w = screen.width;
        const h = screen.height;
        const maxTouch = navigator.maxTouchPoints || 0;

        // 触摸综合判断（兼顾旧API和新标准）
        const hasTouch =
          maxTouch > 0 ||
          "ontouchstart" in window ||
          (window.matchMedia &&
            window.matchMedia("(any-pointer: coarse)").matches);

        // ----- 1. UA 明确指向手机 -----
        if (
          /iPhone|iPod|Android(?!.*Tablet)|Windows Phone|BlackBerry|webOS|Opera Mini/i.test(
            ua,
          )
        ) {
          return 1;
        }

        // ----- 2. UA 明确指向平板 -----
        if (
          /iPad|Tablet|Kindle|Silk|PlayBook|Nexus 7|Nexus 9|SM-T|KFAPWI/i.test(
            ua,
          )
        ) {
          return 1;
        }

        // ----- 3. 桌面操作系统（Windows / Chrome OS / Linux）-----
        if (/Windows NT|CrOS|Linux/i.test(ua)) {
          // 极小尺寸（<600px）且有触摸的 Linux，归为移动端（防嵌入式设备误判）
          if (/Linux/i.test(ua) && (w < 600 || h < 600) && hasTouch) {
            return 1;
          }
          // 其他所有：Windows 触摸本（如 Surface）、ChromeBook 等均视为电脑
          return 2;
        }

        // ----- 4. Macintosh 特殊处理（iPadOS 13+ 伪装成 Mac）-----
        if (/Macintosh/.test(ua)) {
          // 具备多点触控且屏幕≥768px，实质是 iPad
          if (maxTouch > 0 && w >= 768 && h >= 768) {
            return 1;
          }
          return 2; // 真实 Mac 电脑
        }

        // ----- 5. 兜底：UA 无法识别时，结合分辨率和触摸推测 -----
        if (hasTouch) {
          // 有触摸且尺寸较小（<1024px）→ 移动/平板；大屏 → 触摸电脑
          return w < 1024 && h < 1024 ? 1 : 2;
        } else {
          // 无触摸，极窄屏（<600px）→ 手机，其余 → 电脑
          return w < 600 || h < 600 ? 1 : 2;
        }
      }

      // ----- 使用示例 -----
      const result = classifyDevice();
      if (result === 1) {
        window.location.href = "mobile/index.html";
      } else {
        window.location.href = "PC/index.html";
      }
    </script>
  </body>
</html>
