<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        body{margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#fad5f0,#3399ff)}
        h1{font-size:160px;font-weight:200;margin:0;color:#1385ff;text-shadow:4px 4px 12px #666;letter-spacing:10px}
        .sub{font-size:18px;color:#000000;margin-top:10px;letter-spacing:4px;text-shadow:2px 2px 6px #888}
        .back-btn{display:inline-block;margin-top:30px;padding:12px 32px;font-size:16px;color:#fff;background:#1385ff;border-radius:30px;text-decoration:none;transition:all 0.3s;box-shadow:0 4px 15px rgba(19,133,255,0.4);cursor:pointer;}
        .back-btn:hover{background:#49a1ff;transform:scale(1.05);box-shadow:0 6px 20px rgba(19,133,255,0.6)}
    </style>
</head>
<body>
    <h1>404</h1>
	<center>
        <p class="sub">找不到页面<br>Page Not Found</p>
        <a href="./index.html" class="back-btn">返回主页</a>
        <br>
        <p onclick="history.back()" class="back-btn">&#8592; 上一页面</p>
	</center>
</body>
</html>
